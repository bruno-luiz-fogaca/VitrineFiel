# Publica o site no GitHub Pages a cada push na branch main.
# Também dá para rodar à mão na aba "Actions" do GitHub.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Só uma publicação por vez; uma nova cancela a que ainda não terminou.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      # base_path é "/VitrineFiel" enquanto o site estiver em
      # bruno-luiz-fogaca.github.io/VitrineFiel/, e vazio quando o domínio
      # vitrinefiel.com.br estiver ligado.
      - run: npm run build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
